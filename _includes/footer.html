<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-md-6 text-end social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="ms-3 fs-5">{% if item.icon == "google-scholar" or item.icon == "lattes" or item.icon == "researchgate" or item.icon == "orcid" %}
  <i class="ai ai-{{ item.icon }}"></i>
{% else %}
  <i class="fab fa-{{ item.icon }}"></i>
{% endif %}</a>
      {% endfor %}
    </div>
  </div>
</footer>
